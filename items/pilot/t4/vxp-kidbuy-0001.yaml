  params:
  - name: item
    type: string
    description: The item to order, as stated.
    required: false
- name: require_purchase_confirmation
  description: Pause checkout and require the account holder's purchase confirmation
    code before the order is placed.
  params:
  - name: reason
    type: string
    description: Short reason the confirmation is required.
    required: false
